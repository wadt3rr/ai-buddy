services:
  postgres:
    image: postgres:18
    container_name: ai-buddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_buddy
      POSTGRES_USER: ai_buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_buddy -d ai_buddy"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
openapi: 3.1.0

info:
  title: AI Buddy API
  description: REST API for AI Buddy onboarding assistant.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Health
    description: API health checks
  - name: Authentication
    description: User authentication
  - name: Users
    description: Current user information
  - name: Messages
    description: Infinite chat

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: API is running
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages:
    get:
      tags:
        - Messages
      summary: Get chat history
      operationId: listMessages
      description: |
        Returns messages belonging to the authenticated user.
        Messages are returned in chronological order.

        Pagination uses the ID of the oldest message in the current page.
        Pass next_before from the previous response as the before parameter
        to retrieve older messages.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of messages to return. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          required: false
          description: UUID cursor identifying the oldest message from the previous page.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Messages
      summary: Send a chat message
      operationId: sendMessage
      description: |
        Creates a user message and requests an assistant response.
        The message role and user ID are assigned by the backend.
        The client must not provide either field.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: User message and assistant response created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Invalid request or message content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: User message saved, but assistant response could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantUnavailableResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: intern@example.com
        password:
          type: string
          format: password
          example: "example-password"

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          example: Bearer

    User:
      type: object
      required:
        - id
        - email
        - team_role
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        team_role:
          type: string
          example: intern
        created_at:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: Message text. Maximum size is 10000 bytes at the backend.
          example: "I cannot install Go dependencies."

    Message:
      type: object
      required:
        - id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MessageListResponse:
      type: object
      required:
        - messages
        - next_before
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_before:
          type:
            - string
            - "null"
          format: uuid
          description: Cursor for the next page, or null if there are no older messages.

    SendMessageResponse:
      type: object
      required:
        - user_message
        - assistant_message
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message:
          $ref: "#/components/schemas/Message"

    AssistantUnavailableResponse:
      type: object
      required:
        - error
        - user_message
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        user_message:
          $ref: "#/components/schemas/Message"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: Invalid JSON body
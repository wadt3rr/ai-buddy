services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ai_buddy
      POSTGRES_USER: ai_buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/migrations:/migrations:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_buddy -d ai_buddy"]
      interval: 3s
      timeout: 3s
      retries: 20
  ai:
    build: ./ai_service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-demo-internal-token-change-me}
      AI_MODE: ${AI_MODE:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      TRACKER_DB: /state/tracker.sqlite
    volumes:
      - tracker_data:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  seed:
    build: ./backend
    entrypoint: ["/app/seed"]
    environment: &backend_env
      DATABASE_URL: postgres://ai_buddy:${POSTGRES_PASSWORD:-local-demo-password}@postgres:5432/ai_buddy?sslmode=disable
      SEED_EMAIL: ${SEED_EMAIL:-intern@example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-DemoPassword123!}
      SEED_TEAM_ROLE: ${SEED_TEAM_ROLE:-intern}
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-at-least-32-bytes}
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-demo-internal-token-change-me}
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build: ./backend
    environment: *backend_env
    depends_on:
      seed: { condition: service_completed_successfully }
      ai: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend]
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 30
  model:
    profiles: ["llm"]
    image: ollama/ollama:0.40.16
    entrypoint: ["ollama", "pull"]
    command: ["${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
  indexer:
    profiles: ["llm"]
    build: ./ai_service
    entrypoint: ["python", "-m", "buddy.index"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    volumes:
      - tracker_data:/state
    depends_on:
      ollama: { condition: service_healthy }
volumes:
  postgres_data:
  tracker_data:
  ollama_models:
